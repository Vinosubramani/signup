{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <style>
      /* Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      /* Background */
      body {
        height: 100vh;
        background: linear-gradient(135deg, #eef2f7, #dbe4f0);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Signup card */
      .signup-form {
        width: 380px;
        max-width: 90%;
        background: #ffffff;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      }

      /* Mobile responsiveness */
      @media (max-width: 480px) {
        .signup-form {
          padding: 20px;
          margin: 20px;
        }
        
        .signup-form h2 {
          font-size: 1.5rem;
        }
      }

      /* Heading */
      .signup-form h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }

      /* Labels */
      .signup-form label {
        display: block;
        margin-bottom: 6px;
        margin-top: 12px;
        font-size: 14px;
        color: #555;
      }

      /* Inputs */
      .signup-form input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        outline: none;
        transition: border-color 0.3s;
      }

      .signup-form input:focus {
        border-color: #4a7cff;
      }

      /* Button */
      .signup-form button {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #4a7cff;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
      }

      .signup-form button:hover {
        background: #365fd6;
      }

      /* Error text */
      .error-text {
        color: red;
        font-size: 14px;
        margin-top: 8px;
        text-align: center;
      }

      /* Bottom text */
      .bottom-text {
        margin-top: 18px;
        text-align: center;
        font-size: 14px;
      }

      .bottom-text a {
        color: #4a7cff;
        text-decoration: none;
        font-weight: 500;
      }

      .bottom-text a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="signup-form">
    <form method="POST">
    {% csrf_token %}
  <h2 class="signup-title">Sign Up</h2>
  <label>Username</label>
  <input type="text" name="username" required>

  <label>Email</label>
  <input type="email" name="email" required>

  <label>Password</label>
  <input type="password" name="password" required>

  <label>Confirm Password</label>
  <input type="password" name="password1" required>

  <button type="submit">Proceed</button>
</form>

        <p class="bottom-text">
          Already have an account?
          <a href="{% url 'login' %}">Login</a>
        </p>
      </form>
    </div>
  </body>
</html>
