{% if user.is_authenticated and is_first_order %}
<!-- Floating First Order Banner -->
<div id="firstOrderBanner" class="first-order-floating-banner">
    <div class="banner-content">
        <div class="banner-icon">🎉</div>
        <div class="banner-text">
            <strong>First Order Special!</strong><br>
            <small>Get 10% OFF now!</small>
        </div>
        <button class="banner-close" onclick="closeBanner()">&times;</button>
    </div>
</div>

<style>
.first-order-floating-banner {
    position: fixed;
    bottom: 80px;
    right: 20px;
    background: linear-gradient(45deg, #28a745, #20c997);
    color: white;
    border-radius: 15px;
    padding: 15px;
    box-shadow: 0 8px 25px rgba(40, 167, 69, 0.3);
    z-index: 999;
    max-width: 250px;
    animation: slideIn 0.5s ease-out;
}

.banner-content {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
}

.banner-icon {
    font-size: 24px;
}

.banner-text {
    flex: 1;
    font-size: 14px;
}

.banner-close {
    background: none;
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
    position: absolute;
    top: -5px;
    right: -5px;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.banner-close:hover {
    background: rgba(255, 255, 255, 0.2);
}

@keyframes slideIn {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

@media (max-width: 768px) {
    .first-order-floating-banner {
        bottom: 70px;
        right: 10px;
        left: 10px;
        max-width: none;
    }
}
</style>

<script>
function closeBanner() {
    const banner = document.getElementById('firstOrderBanner');
    banner.style.animation = 'slideOut 0.3s ease-in';
    setTimeout(() => {
        banner.style.display = 'none';
    }, 300);
}

// Add slideOut animation
const style = document.createElement('style');
style.textContent = `
    @keyframes slideOut {
        from {
            transform: translateX(0);
            opacity: 1;
        }
        to {
            transform: translateX(100%);
            opacity: 0;
        }
    }
`;
document.head.appendChild(style);
</script>
{% endif %}
